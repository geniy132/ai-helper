[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "b2b-ai-product-card-assistant"
version = "0.1.0"
description = "AI-помощник для подготовки карточек товаров B2B (КИПиА) для e-commerce"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # REST API веб-фреймворк
    "fastapi>=0.110.0",
    # Высокопроизводительный ASGI-сервер
    "uvicorn>=0.28.0",
    # Асинхронный HTTP-клиент для REST API Ollama
    "httpx>=0.27.0",
    # Валидация входных/выходных структур данных (v2)
    "pydantic>=2.6.0",
    # Загрузка переменных окружения из .env
    "python-dotenv>=1.0.0",
    # Шаблонизатор для разметки и текстов
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    # Фреймворк для модульных и интеграционных тестов
    "pytest>=8.0.0",
    # Поддержка асинхронных тестов в pytest
    "pytest-asyncio>=0.23.0",
    # Быстрый комплексный линтер и форматтер кода
    "ruff>=0.3.0",
    # Пассивный статический анализатор синтаксиса
    "pyflakes>=3.2.0",
    # Анализатор стиля кода PEP 8
    "flake8>=7.0.0",
    # Строгий статический анализатор типов (type checker)
    "mypy>=1.9.0",
]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "PIE",  # flake8-pie
]
ignore = [
    "RUF001",  # ambiguous characters (Cyrillic letters in B2B catalog)
    "RUF002",  # ambiguous characters in docstrings
    "RUF003",  # ambiguous characters in comments
    "E501",    # line length handled by formatter
]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
mypy_path = "."
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
